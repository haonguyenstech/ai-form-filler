<!doctype html><html><head><meta charset="utf-8"><title>bootstrap modal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body class="p-4">
<h1>Bootstrap modal</h1>
<form id="bg"><label>Background name <input id="bgName" class="form-control"></label>
<select id="bgCity" class="form-select"><option selected>Open this select menu</option><option>Hanoi</option></select></form>
<button id="open" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#m">Open</button>
<div class="modal fade" id="m" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">New message</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><form>
    <div class="mb-3"><label for="rcp" class="form-label">Recipient</label><input id="rcp" class="form-control"></div>
    <div class="mb-3"><label for="em" class="form-label">Email</label><input type="email" id="em" class="form-control"></div>
    <div class="mb-3"><label for="pri" class="form-label">Priority</label><select id="pri" class="form-select"><option selected>Open this select menu</option><option value="1">Low</option><option value="2">High</option></select></div>
    <div class="form-check"><input class="form-check-input" type="radio" name="ch" id="ch1" value="email"><label class="form-check-label" for="ch1">By email</label></div>
    <div class="form-check"><input class="form-check-input" type="radio" name="ch" id="ch2" value="sms"><label class="form-check-label" for="ch2">By SMS</label></div>
    <div class="form-check"><input class="form-check-input" type="checkbox" id="urg"><label class="form-check-label" for="urg">Urgent</label></div>
    <div class="mb-3"><label for="msg" class="form-label">Message</label><textarea id="msg" class="form-control"></textarea></div>
  </form></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.__isOpen = () => document.getElementById('m').classList.contains('show');</script>
</body></html>
