<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng ký thành viên</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #1f2430;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 55%, #ecfeff 100%); min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 36px 24px 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #3346d3; margin-bottom: 18px; }
  .brand i { width: 28px; height: 28px; border-radius: 8px; background: #3346d3; display: inline-block; }
  .card { background: #fff; border-radius: 18px; padding: 30px 32px; box-shadow: 0 10px 40px rgba(30, 41, 80, .08); border: 1px solid #e6e9f2; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  p.sub { margin: 0 0 22px; color: #667085; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #344054; }
  label .req { color: #e5484d; }
  input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 10px; font: inherit; background: #fff; color: #1f2430; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #3346d3; box-shadow: 0 0 0 3px rgba(51, 70, 211, .15); }
  textarea { min-height: 80px; resize: vertical; }
  .radios { display: flex; gap: 18px; padding-top: 8px; }
  .radios label, .check { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; margin: 0; }
  .hint { font-size: 12px; color: #667085; margin-top: 4px; }
  button { margin-top: 22px; padding: 11px 22px; border: 0; border-radius: 10px; background: #3346d3; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i></i> Demo Workspace</div>
  <div class="card">
    <h1>Đăng ký thành viên</h1>
    <p class="sub">Điền thông tin để tạo tài khoản mới.</p>
    <form id="f">
      <div class="grid">
        <div><label for="name">Họ và tên <span class="req">*</span></label><input type="text" id="name" name="fullName" required></div>
        <div><label for="email">Email <span class="req">*</span></label><input type="email" id="email" name="email" required></div>
        <div><label for="phone">Số điện thoại</label><input type="tel" id="phone" name="phone"></div>
        <div><label for="dob">Ngày sinh</label><input type="date" id="dob" name="dob"></div>
        <div>
          <label id="gender-lbl">Giới tính</label>
          <div class="radios" role="radiogroup" aria-labelledby="gender-lbl">
            <label><input type="radio" name="gender" value="m"> Nam</label>
            <label><input type="radio" name="gender" value="f"> Nữ</label>
            <label><input type="radio" name="gender" value="o"> Khác</label>
          </div>
        </div>
        <div>
          <label for="city">Thành phố</label>
          <select id="city" name="city">
            <option value="">-- Chọn thành phố --</option>
            <option>Hà Nội</option><option>TP. Hồ Chí Minh</option><option>Đà Nẵng</option><option>Huế</option><option>Cần Thơ</option>
          </select>
        </div>
        <div><label for="company">Công ty</label><input type="text" id="company" name="company"></div>
        <div><label for="code">Mã nhân viên</label><input type="text" id="code" name="code" pattern="[A-Z]{3}-\d{4}"><div class="hint">Dạng ABC-1234</div></div>
        <div class="full"><label for="bio">Giới thiệu bản thân</label><textarea id="bio" name="bio"></textarea></div>
        <div class="full"><label class="check"><input type="checkbox" id="agree" required> Tôi đồng ý với điều khoản sử dụng</label></div>
      </div>
      <button type="submit">Tạo tài khoản</button>
    </form>
  </div>
</div>
</body>
</html>
